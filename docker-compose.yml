services:
  postgres:
    image: postgres:16-alpine
    container_name: middlepoint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: middlepoint
      POSTGRES_PASSWORD: middlepoint_secret
      POSTGRES_DB: middlepoint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middlepoint -d middlepoint"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
